name: Keep the site awake

# Render's free tier puts the site to sleep after 15 minutes without visits,
# and the next visitor then waits 30-60s for it to wake. A tiny ping every
# 14 minutes keeps it awake. One always-on free service fits inside Render's
# 750 free hours a month. /api/ping touches no database and no Yahoo.
# (GitHub may run scheduled jobs a few minutes late, and pauses them after
# 60 days without commits; re-enable from the Actions tab if that happens.)
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://signal-jagk.onrender.com/api/ping
