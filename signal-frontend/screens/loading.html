<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Watchlist — Loading</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="signal-page">
<div class="signal-shell">

<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
  <div style="display:flex;align-items:flex-end;gap:1px">
    <span style="font-family:Anton,sans-serif;font-size:38px;line-height:.9;color:#fff;background:#E91E8C;padding:2px 7px;transform:rotate(-5deg);display:inline-block;box-shadow:2px 3px 0 rgba(110,34,68,.25)">S</span>
    <span style="font-family:'Playfair Display',serif;font-style:italic;font-size:34px;line-height:.9;color:#B8135F;background:#FFD6E5;padding:3px 5px;transform:rotate(4deg);display:inline-block">i</span>
    <span style="font-family:Anton,sans-serif;font-size:34px;line-height:.9;color:#E91E8C;background:#FFEFF5;padding:3px 6px;transform:rotate(-2deg);display:inline-block;border:1.5px dashed #F58BA6">g</span>
    <span style="font-family:'Playfair Display',serif;font-size:33px;line-height:.9;color:#fff;background:#C96A8B;padding:3px 6px;transform:rotate(6deg);display:inline-block">n</span>
    <span style="font-family:Anton,sans-serif;font-size:36px;line-height:.9;color:#B8135F;background:#FFC2D8;padding:2px 6px;transform:rotate(-6deg);display:inline-block">a</span>
    <span style="font-family:'Playfair Display',serif;font-weight:700;font-size:34px;line-height:.9;color:#fff;background:#E91E8C;padding:3px 7px;transform:rotate(3deg);display:inline-block;box-shadow:2px 3px 0 rgba(110,34,68,.25)">l</span>
  </div>
  <div style="text-align:right">
    <div style="font-size:13px;font-weight:700;color:#B8135F;letter-spacing:.02em">5 sep · 3:42pm</div>
    <div style="font-size:11.5px;font-weight:600;color:#A8567A">1 feed lagging</div>
  </div>
</div>

<div style="background:#F79EB6;border-radius:26px;padding:30px 22px;position:relative;box-shadow:0 10px 26px rgba(233,30,140,.22)">
  <div style="position:absolute;left:0;right:0;top:-9px;height:18px;background-image:radial-gradient(circle at 11px 11px,#F79EB6 10px,rgba(0,0,0,0) 11px);background-size:22px 22px;background-repeat:repeat-x"></div>
  <div style="position:absolute;left:0;right:0;bottom:-9px;height:18px;background-image:radial-gradient(circle at 11px 7px,#F79EB6 10px,rgba(0,0,0,0) 11px);background-size:22px 22px;background-repeat:repeat-x"></div>
  <div style="text-align:center;font-size:26px;font-weight:800;color:#fff;letter-spacing:.01em;margin-bottom:14px">loading</div>
  <div style="border:3px solid #fff;border-radius:6px;height:34px;position:relative;overflow:visible">
    <div style="height:100%;background:rgba(255,255,255,.4);animation:bunnyRun 2.4s ease-in-out forwards;border-radius:3px"></div>
    <div style="position:absolute;top:-8px;left:0;height:0;animation:bunnyRun 2.4s ease-in-out forwards">
      <div style="width:34px;height:34px;flex:none;border-radius:50%;background:#fff;border:2.5px solid #E4809C;display:flex;align-items:center;justify-content:center;position:absolute;right:-17px;top:0;animation:hop .5s ease-in-out infinite">
        <div style="position:absolute;left:20px;top:-8px;width:6px;height:12px;background:#fff;border:2.5px solid #E4809C;border-radius:4px;transform:rotate(12deg)"></div>
        <div style="position:absolute;left:11px;top:-9px;width:6px;height:12px;background:#fff;border:2.5px solid #E4809C;border-radius:4px;transform:rotate(-10deg)"></div>
        <span style="font-size:10px;color:#E4809C;font-weight:700;margin-top:6px">• ᴗ •</span>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin-top:16px;font-size:13.5px;font-weight:600;color:#fff">checking on your 5 friends…</div>
</div>

<div style="display:flex;gap:5px;background:#fff;border:2px solid #FFD6E5;border-radius:999px;padding:6px;box-shadow:0 6px 0 rgba(233,30,140,.10),0 10px 22px rgba(233,30,140,.13);margin-top:4px">
  <a href="home.html" title="watchlist" style="flex:1;border:none;background:#FFF7FA;color:#B8135F;border-radius:999px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M4 10.5 12 4l8 6.5V20H4z"></path><path d="M9.5 20v-6h5v6"></path></svg>
    <span style="font-size:10.5px;font-weight:800;letter-spacing:.01em">home</span>
  </a>
  <a href="discover.html" title="market" style="flex:1;border:none;background:#FFF7FA;color:#B8135F;border-radius:999px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M4 17l5-6 4 3 6-8"></path><path d="M15 6h4v4"></path></svg>
    <span style="font-size:10.5px;font-weight:800">market</span>
  </a>
  <a href="search.html" title="add a stock" style="flex:1;border:none;background:#FFF7FA;color:#B8135F;border-radius:999px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><circle cx="11" cy="11" r="6"></circle><path d="M15.5 15.5 20 20"></path><path d="M11 8.5v5M8.5 11h5"></path></svg>
    <span style="font-size:10.5px;font-weight:800">add</span>
  </a>
  <a href="alerts.html" title="notifications" style="flex:1;border:none;background:#FFF7FA;color:#B8135F;border-radius:999px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;text-decoration:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 1.5 5.5H5S6.5 14 6.5 10z"></path><path d="M10.5 18.5a1.8 1.8 0 0 0 3 0"></path></svg>
    <span style="font-size:10.5px;font-weight:800">pings</span>
    <span style="position:absolute;top:6px;right:12px;width:8px;height:8px;border-radius:50%;background:#E91E8C;border:1.5px solid #fff;animation:blinkdot 2.4s ease-in-out infinite"></span>
  </a>
  <a href="settings.html" title="her rules" style="flex:1;border:none;background:#FFF7FA;color:#B8135F;border-radius:999px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M5 8h14M5 16h14"></path><circle cx="10" cy="8" r="2.4" fill="currentColor" stroke="none"></circle><circle cx="15" cy="16" r="2.4" fill="currentColor" stroke="none"></circle></svg>
    <span style="font-size:10.5px;font-weight:800">rules</span>
  </a>
</div>

</div>
</div>
</body>
</html>
